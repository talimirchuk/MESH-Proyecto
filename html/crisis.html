<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/crisis.css">
</head>
<body>

    <div class="encabezado">
        <a href="index.html" class="btn-volver">←</a>
        <h1>CRISIS <i class="fa-solid fa-triangle-exclamation"></i></h1>
    </div>

    <form id="form-crisis">
        <!-- Fila 1 -->
        <div class="caja-pregunta">
            <label>¿Hubo crisis?</label>
            <div class="opciones-si-no" id="grupo-hubo-crisis">
                <button type="button" class="btn-opcion" data-valor="si">Sí</button>
                <button type="button" class="btn-opcion" data-valor="no">No</button>
            </div>
        </div>

        <div class="caja-pregunta oculto" id="caja-tipo-crisis">
            <label for="tipo-crisis">Tipo de crisis</label>
            <input type="text" class="formulario" id="tipo-crisis" placeholder="Describa el tipo">
        </div>

        <!-- Fila 2: Día / Mes / Año agrupados -->
        <div class="grupo-fecha-triple">
            <div class="caja-pregunta">
                <label for="dia">Día</label>
                <input type="number" class="formulario" id="dia" min="1" max="31" placeholder="DD">
            </div>
            <div class="caja-pregunta">
                <label for="mes">Mes</label>
                <select class="formulario" id="mes">
                    <option value="" disabled selected>Mes</option>
                    <option value="Enero">Enero</option>
                    <option value="Febrero">Febrero</option>
                    <option value="Marzo">Marzo</option>
                    <option value="Abril">Abril</option>
                    <option value="Mayo">Mayo</option>
                    <option value="Junio">Junio</option>
                    <option value="Julio">Julio</option>
                    <option value="Agosto">Agosto</option>
                    <option value="Septiembre">Septiembre</option>
                    <option value="Octubre">Octubre</option>
                    <option value="Noviembre">Noviembre</option>
                    <option value="Diciembre">Diciembre</option>
                </select>
            </div>
            <div class="caja-pregunta">
                <label for="anio">Año</label>
                <input type="number" class="formulario" id="anio" placeholder="AAAA" oninput="if(this.value.length > 4) this.value = this.value.slice(0, 4);">
            </div>
        </div>

        <!-- Espaciador si no se muestra Tipo de Crisis -->
        <div class="espaciador-vacio"></div>

        <!-- Fila 3 -->
        <div class="caja-pregunta">
            <label>¿Hubo pastilla de rescate?</label>
            <div class="opciones-si-no" id="grupo-pastilla">
                <button type="button" class="btn-opcion" data-valor="si">Sí</button>
                <button type="button" class="btn-opcion" data-valor="no">No</button>
            </div>
        </div>

        <div class="caja-pregunta">
            <label for="cual-pastilla">¿Cuál?</label>
            <input type="text" class="formulario" id="cual-pastilla">
        </div>

        <!-- Fila 4 -->
        <div class="caja-pregunta">
            <label for="observaciones">Observaciones</label>
            <textarea class="formulario" id="observaciones"></textarea>
        </div>

        <div class="caja-pregunta" style="justify-content: flex-end;">
            <button id="guardar" type="submit">
                <i class="fa-solid fa-floppy-disk"></i> Guardar registro
            </button>
        </div>
    </form>

    <script src="js/crisis.js"></script>
</body>
</html>
