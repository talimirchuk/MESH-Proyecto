<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH - Gráficos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link class="css-path" rel="stylesheet" href="../css/graficos.css">
    <meta name="view-transition" content="same-origin">
</head>

<body>

    <div class="sidebar">
        <h2>MESH</h2>
        <button><a href="inicio.html"><i class="fa-solid fa-house"></i>Inicio</a></button>        
        <button><a href="paciente.html"><i class="fa-solid fa-user"></i>Paciente</a></button>
        <button><a href="historial.html"><i class="fa-solid fa-book-medical"></i>Historial</a></button>
        <button><a href="registros.html"><i class="fa-solid fa-plus"></i>Registros</a></button>
        <button><a href="graficos.html" class="active"><i class="fa-solid fa-chart-simple"></i>Gráficos</a></button>
        <button><a href="recordatorios.html"><i class="fa-solid fa-list-check"></i>Recordatorios</a></button>
        <button><a href="configuracion.html"><i class="fa-solid fa-gear"></i>Configuración</a></button>
    </div>

    <main>
        <h1 style="view-transition-name: titulo-seccion;">Gráficos</h1>
        
        <section class="historial">
            <!-- Dropdown personalizado de Categorías con casillas -->
            <div class="dropdown-categorias">
                <button type="button" class="btn-dropdown" id="btn-dropdown-categorias">
                    <span id="texto-categorias-seleccionadas">Categorías (hasta 2)</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
        
                <!-- Lista desplegable oculta con casillas -->
                <div class="lista-opciones" id="lista-categorias">
                    <label class="opcion-item">
                        <input type="checkbox" value="sueno" class="checkbox-categoria"> Sueño
                    </label>
                    <label class="opcion-item">
                        <input type="checkbox" value="medicacion" class="checkbox-categoria"> Medicación
                    </label>
                    <label class="opcion-item">
                        <input type="checkbox" value="crisis" class="checkbox-categoria"> Crisis
                    </label>
                    <label class="opcion-item">
                        <input type="checkbox" value="estado_animo" class="checkbox-categoria"> Estado de ánimo
                    </label>
                    <label class="opcion-item">
                        <input type="checkbox" value="menstruacion" class="checkbox-categoria"> Menstruación
                    </label>
                </div>
            </div>
        
            <!-- Filtro de tiempo personalizado: "Últimos [ 7 ] [ Días v ]" -->
            <div class="filtro-tiempo">
                <span>Últimos</span>
                <input type="number" id="cantidad-tiempo" value="7" min="1">
                <select id="unidad-tiempo">
                    <option value="dias" selected>Días</option>
                    <option value="meses">Meses</option>
                    <option value="anos">Años</option>
                </select>
            </div>
        </section>

        <div class="dashboard-gráficos">
            <!-- Acá Chart.js va a hacer el gráfico -->

            <canvas id="graficoCanvas"></canvas>
        </div>

    </main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>    
    <script src="../js/graficos.js"></script>

</body>
</html>
