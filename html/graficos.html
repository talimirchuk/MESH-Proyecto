<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH - Gráficos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link class="css-path" rel="stylesheet" href="../css/graficos.css">
    <meta name="view-transition" content="same-origin">
</head>

<body>

    <div class="sidebar">
        <h2>MESH</h2>
        <button><a href="inicio.html"><i class="fa-solid fa-house"></i>Inicio</a></button>        
        <button><a href="paciente.html"><i class="fa-solid fa-user"></i>Paciente</a></button>
        <button><a href="historial.html"><i class="fa-solid fa-book-medical"></i>Historial</a></button>
        <button><a href="registros.html"><i class="fa-solid fa-plus"></i>Registros</a></button>
        <button><a href="graficos.html" class="active"><i class="fa-solid fa-chart-simple"></i>Gráficos</a></button>
        <button><a href="recordatorios.html"><i class="fa-solid fa-list-check"></i>Recordatorios</a></button>
        <button><a href="configuracion.html"><i class="fa-solid fa-gear"></i>Configuración</a></button>
    </div>

    <main>
        <h1 style="view-transition-name: titulo-seccion;">Gráficos</h1>
        
        <section class="historial">
            <div class="select-categoría">
                <select id="categoría">
                    <option value="" disabled selected hidden>Categoría</option>
                    <option value="sueno">Sueño</option>
                    <option value="medicacion">Medicación</option>
                    <option value="crisis">Crisis</option>
                    <option value="estado_animo">Estado de ánimo</option>
                    <option value="menstruacion">Menstruación</option>
                </select>
            </div>
        
            <div class="select-periodo">
                <select id="periodo">
                    <option value="" disabled selected hidden>Fecha</option>
                    <option value="7dias">Últimos 7 días</option>
                    <option value="15dias">Últimos 15 días</option>
                    <option value="30dias">Últimos 30 días</option>
                </select>
            </div>
        </section>

        <div class="dashboard-gráficos">
            <!-- Acá Chart.js va a hacer el gráfico -->

            <canvas id="graficoCanvas"></canvas>
        </div>

    </main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>    
    <script src="../js/graficos.js"></script>

</body>
</html>
