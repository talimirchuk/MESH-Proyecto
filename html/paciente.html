<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH - Paciente</title>

    <link class="css-path" rel="stylesheet" href="../css/style.css">
    <link class="css-path" rel="stylesheet" href="../css/paciente.css">
    <meta name="view-transition" content="same-origin">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>MESH</h2>
        <button><a href="inicio.html"><i class="fa-solid fa-house"></i>Inicio</a></button>        
        <button><a href="paciente.html" class="active"><i class="fa-solid fa-user"></i>Paciente</a></button>
        <button><a href="historial.html"><i class="fa-solid fa-book-medical"></i>Historial</a></button>
        <button><a href="registros.html"><i class="fa-solid fa-plus"></i>Registros</a></button>
        <button><a href="graficos.html"><i class="fa-solid fa-chart-simple"></i>Gráficos</a></button>
        <button><a href="recordatorios.html"><i class="fa-solid fa-list-check"></i>Recordatorios</a></button>
        <button><a href="configuracion.html"><i class="fa-solid fa-gear"></i>Configuración</a></button>
    </div>

    <main>

        <!-- ENCABEZADO DE LA SECCIÓN PACIENTE -->
        <section class="inicio-header">
            <div class="paciente-perfil">
                <div class="paciente-foto-placeholder"></div>
                <h1 class="paciente-nombre" id="paciente-nombre">--</h1>
            </div>

            <!-- Encabezado con Botón de Editar -->
            <div class="ficha-acciones">
                <button class="btn-editar" id="btn-editar">
                    <i class="fa-solid fa-pen-to-square"></i> Editar Ficha de Datos
                </button>
            </div>
        </section>

        <!-- CONTENIDO FICHA DE DATOS -->
        <section class="ficha-paciente-container">
            <div class="datos-grid-dos-columnas">

                <!-- COLUMNA IZQUIERDA -->
                <div class="columna-datos">
                    <div class="tarjeta-dato">
                        <span class="label">Fecha de Nacimiento</span>
                        <div class="campo-con-edicion">
                            <p class="valor" id="paciente-nacimiento">--</p>
                            <i class="fa-solid fa-pen-to-square icono-editar-campo"></i>
                        </div>
                    </div>

                    <div class="tarjeta-dato">
                        <span class="label">Diagnóstico</span>
                        <div class="campo-con-edicion">
                            <p class="valor" id="paciente-diagnostico">--</p>
                            <i class="fa-solid fa-pen-to-square icono-editar-campo"></i>
                        </div>
                    </div>

                    <div class="tarjeta-dato">
                        <span class="label">Contacto Principal</span>
                        <div class="campo-con-edicion">
                            <p class="valor" id="paciente-contacto">--</p>
                            <i class="fa-solid fa-pen-to-square icono-editar-campo"></i>
                        </div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA -->
                <div class="columna-datos">
                    <div class="seccion-medicamentos">
                        <span class="label-titulo">Medicamentos Habituales</span>
                        <div id="contenedor-medicamentos" class="contenedor-medicamentos">
                            <!-- Se renderizan dinámicamente las tarjetas de medicamentos -->
                        </div>
                    </div>

                    <div class="tarjeta-dato">
                        <span class="label">Observaciones</span>
                        <div class="campo-con-edicion">
                            <p class="valor" id="paciente-observaciones">--</p>
                            <i class="fa-solid fa-pen-to-square icono-editar-campo"></i>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="../js/paciente.js"></script>
</body>

</html>
