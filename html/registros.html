    <!-- MAIN -->
    <main class="main-registros">
        <h1 class="titulo-registros">Registros</h1>
        <p class="subtitulo-pregunta">¿Qué querés registrar hoy?</p>

        <!-- TARJETAS CIRCULARES -->
        <div class="registros-flex-container">
            <!-- Sueño -->
            <div class="registro-item">
                <button class="registro-circulo" data-tipo="sueno" aria-label="Sueño">

                    </svg>
                </button>
                <span class="etiqueta-registro">Sueño</span>
            </div>

            <!-- Estado de Ánimo -->
            <div class="registro-item">
                <button class="registro-circulo" data-tipo="animo" aria-label="Estado de Ánimo">
                    <svg width="60" height="60" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M39.2478 39.2487C35.122 43.3745 29.5262 45.6924 23.6914 45.6924C17.8566 45.6924 12.2609 43.3745 8.13506 39.2487C4.00926 35.1229 1.69141 29.5271 1.69141 23.6924C1.69141 17.8576 4.00926 12.2618 8.13506 8.13603C12.2609 4.01023 17.8566 1.69238 23.6914 1.69238C29.5262 1.69238 35.122 4.01023 39.2478 8.13603C43.3736 12.2618 45.6914 17.8576 45.6914 23.6924C45.6914 29.5271 43.3736 35.1229 39.2478 39.2487Z" stroke="black" stroke-width="3.38" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="16" cy="18" r="2.5" fill="black"/>
                        <circle cx="32" cy="18" r="2.5" fill="black"/>
                        <path d="M14 28C17 35 31 35 34 28" stroke="black" stroke-width="3.38" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <span class="etiqueta-registro">Estado de ánimo</span>
            </div>

            <!-- Medicación -->
            <div class="registro-item">
                <button class="registro-circulo" data-tipo="medicacion" aria-label="Medicación">
                    <svg width="55" height="55" viewBox="0 0 102 103" fill="none">
                        <path d="M68.9341 0.000173397C64.5846 -0.0139592 60.2757 0.835947 56.2573 2.50056C52.239 4.16518 48.5913 6.61134 45.5259 9.69708L9.65781 45.5652C-3.21927 58.4423 -3.21927 79.4523 9.65781 92.3815C15.9139 98.6375 24.2032 102.078 33.0659 102.078C41.9287 102.078 50.218 98.6375 56.4741 92.3815L92.3422 56.5133C105.219 43.6363 105.219 22.6263 92.3422 9.69708C89.2769 6.61134 85.6292 4.16518 81.6108 2.50056C77.5925 0.835947 73.2835 -0.0139592 68.9341 0.000173397ZM84.9392 49.1103L70.7066 63.3429L38.6443 31.2805L52.8768 17.048C57.1518 12.773 62.8344 10.427 68.8819 10.427C74.9295 10.427 80.6121 12.773 84.887 17.048C89.1193 21.31 91.4945 27.0727 91.4945 33.0791C91.4945 39.0856 89.1193 44.8483 84.887 49.1103H84.9392Z" fill="black"/>
                    </svg>
                </button>
                <span class="etiqueta-registro">Medicación</span>
            </div>

            <!-- Crisis -->
            <div class="registro-item">
                <button class="registro-circulo" data-tipo="crisis" aria-label="Crisis">
                    <svg width="55" height="55" viewBox="0 0 112 100" fill="none">
                        <path d="M55.6299 36.2734V58.9047M55.6299 74.7466V77.0097" stroke="black" stroke-width="9.18" stroke-linecap="round"/>
                        <path d="M47.2149 9.35259L5.81224 81.6096C2.32376 87.6929 6.95466 95.116 14.2325 95.116H97.0226C104.306 95.116 108.926 87.6929 105.453 81.6096L64.0555 9.35259C60.4242 3.00226 50.8513 3.00226 47.2149 9.35259Z" stroke="black" stroke-width="9.18" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <span class="etiqueta-registro">Crisis</span>
            </div>

            <!-- Menstruación -->
            <div class="registro-item">
                <button class="registro-circulo" data-tipo="menstruacion" aria-label="Menstruación">
                    <svg width="45" height="60" viewBox="0 0 68 110" fill="none">
                        <path d="M34 0C15.2433 0 0 14.7131 0 32.8174C0 49.062 12.2967 62.5171 28.3333 65.1425V76.5739H11.3333V87.513H28.3333V109.391H39.6667V87.513H56.6667V76.5739H39.6667V65.1425C55.7033 62.5171 68 49.062 68 32.8174C68 14.7131 52.7567 0 34 0ZM34 54.6957C21.4767 54.6957 11.3333 44.9051 11.3333 32.8174C11.3333 20.7297 21.4767 10.9391 34 10.9391C46.5233 10.9391 56.6667 20.7297 56.6667 32.8174C56.6667 44.9051 46.5233 54.6957 34 54.6957Z" fill="black"/>
                    </svg>
                </button>
                <span class="etiqueta-registro">Menstruación</span>
            </div>
        </div>

        <!-- MODAL CRISIS -->
        <div id="modal-crisis" class="modal-overlay oculto">
            <div class="modal-tarjeta">
                <button type="button" class="btn-cerrar-modal" id="btn-cerrar-modal" aria-label="Cerrar">&times;</button>
               
                <div class="modal-encabezado">
                    <h2 class="modal-titulo">Crisis</h2>
                    <svg width="45" height="40" viewBox="0 0 104 93" fill="none">
                        <path d="M51.812 33.7832V54.8613M51.812 69.616V71.7238" stroke="black" stroke-width="8.55" stroke-linecap="round"/>
                        <path d="M43.9745 8.71128L5.41321 76.0095C2.16413 81.6753 6.47723 88.5889 13.2556 88.5889H90.3641C97.1472 88.5889 101.451 81.6753 98.216 76.0095L59.6594 8.71128C56.2773 2.79676 47.3614 2.79676 43.9745 8.71128Z" stroke="black" stroke-width="8.55" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <form id="form-crisis">
                    <!-- ¿Qué tipo de crisis tuviste? -->
                    <div class="caja-campo">
                        <label for="tipo-crisis">¿Qué tipo de crisis tuviste?</label>
                        <div class="input-desplegable-wrapper">
                            <input type="text" id="tipo-crisis" list="lista-tipos" placeholder="Escribí o seleccioná..." autocomplete="off">
                            <datalist id="lista-tipos"></datalist>
                        </div>
                    </div>

                    <!-- ¿Cuándo? -->
                    <div class="caja-campo">
                        <label>¿Cuándo?</label>
                        <div class="grupo-fecha">
                            <input type="number" id="dia" placeholder="dd" min="1" max="31">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="mes" placeholder="mm" min="1" max="12">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="anio" placeholder="aaaa" min="1000" max="9999">
                        </div>
                    </div>

                    <!-- ¿A qué hora ocurrió? + AM/PM -->
                    <div class="caja-campo">
                        <label for="hora-crisis">¿A qué hora ocurrió?</label>
                        <div class="campo-hora-caja">
                            <input type="time" id="hora-crisis">
                            <div class="opciones-periodo">
                                <button type="button" class="btn-periodo" data-periodo="AM">AM</button>
                                <button type="button" class="btn-periodo" data-periodo="PM">PM</button>
                            </div>
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="caja-campo">
                        <label for="observaciones">Observaciones</label>
                        <textarea id="observaciones" maxlength="10" placeholder="Máximo 10 caracteres"></textarea>
                    </div>

                    <!-- Botón Guardar -->
                    <button type="button" id="guardar" class="btn-guardar-modal">
                        <svg width="32" height="32" viewBox="0 0 73 72" fill="none">
                            <path d="M17.8079 68.7743H54.6162C58.5211 68.7743 62.266 67.2363 65.0272 64.4987C67.7883 61.7611 69.3395 58.0481 69.3395 54.1765V19.1927C69.3393 18.2249 68.9341 17.2968 68.261 16.6125L55.6947 4.15328C55.0045 3.46882 54.0685 3.08419 53.0923 3.08398H17.8079C13.903 3.08398 10.1581 4.62197 7.3969 7.3596C4.63574 10.0972 3.08453 13.8102 3.08453 17.6818V54.1765C3.08453 58.0481 4.63574 61.7611 7.3969 64.4987C10.1581 67.2363 13.903 68.7743 17.8079 68.7743Z" stroke="black" stroke-width="6.16" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M54.616 68.7743V43.2281C54.616 42.2602 54.2282 41.3319 53.5379 40.6475C52.8476 39.9631 51.9114 39.5786 50.9352 39.5786H21.4885C20.5123 39.5786 19.5761 39.9631 18.8858 40.6475C18.1955 41.3319 17.8077 42.2602 17.8077 43.2281V68.7743" stroke="black" stroke-width="6.16"/>
                        </svg>
                        <span>Guardar registro</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- MODAL MENSTRUACIÓN -->
        <div id="modal-menstruacion" class="modal-overlay oculto">
            <div class="modal-tarjeta">
                <button type="button" class="btn-cerrar-modal" id="btn-cerrar-menstruacion" aria-label="Cerrar">&times;</button>
               
                <div class="modal-encabezado">
                    <h2 class="modal-titulo">Menstruación</h2>
                    <svg width="32" height="50" viewBox="0 0 45 71" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.0676 0C9.89363 0 0 9.5495 0 21.3C0 31.8435 7.9811 40.5765 18.3896 42.2805V49.7H7.35586V56.8H18.3896V71H25.7455V56.8H36.7793V49.7H25.7455V42.2805C36.154 40.5765 44.1351 31.8435 44.1351 21.3C44.1351 9.5495 34.2415 0 22.0676 0ZM22.0676 35.5C13.9393 35.5 7.35586 29.1455 7.35586 21.3C7.35586 13.4545 13.9393 7.1 22.0676 7.1C30.1958 7.1 36.7793 13.4545 36.7793 21.3C36.7793 29.1455 30.1958 35.5 22.0676 35.5Z" fill="black"/>
                    </svg>
                </div>

                <form id="form-menstruacion">
                    <!-- Fecha Inicio -->
                    <div class="caja-campo">
                        <div class="label-con-icono">
                            <svg width="24" height="22" viewBox="0 0 58 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18.2 2.59961V12.9996M39 2.59961V12.9996M2.59998 23.3996H54.6" stroke="black" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M44.2 2.59961H13C7.25621 2.59961 2.59998 7.25585 2.59998 12.9996V38.9996C2.59998 44.7434 7.25621 49.3996 13 49.3996H44.2C49.9437 49.3996 54.6 44.7434 54.6 38.9996V12.9996C54.6 7.25585 49.9437 2.59961 44.2 2.59961Z" stroke="black" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <label>¿En qué fecha empezó el período?</label>
                        </div>
                        <div class="grupo-fecha">
                            <input type="number" id="inicio-dia" placeholder="dd" min="1" max="31">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="inicio-mes" placeholder="mm" min="1" max="12">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="inicio-anio" placeholder="aaaa" min="1000" max="9999">
                        </div>
                    </div>

                    <!-- Fecha Fin -->
                    <div class="caja-campo">
                        <div class="label-con-icono">
                            <svg width="24" height="22" viewBox="0 0 58 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18.2 2.59961V12.9996M39 2.59961V12.9996M2.59998 23.3996H54.6" stroke="black" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M44.2 2.59961H13C7.25621 2.59961 2.59998 7.25585 2.59998 12.9996V38.9996C2.59998 44.7434 7.25621 49.3996 13 49.3996H44.2C49.9437 49.3996 54.6 44.7434 54.6 38.9996V12.9996C54.6 7.25585 49.9437 2.59961 44.2 2.59961Z" stroke="black" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <label>¿En qué fecha terminó el período?</label>
                        </div>
                        <div class="grupo-fecha">
                            <input type="number" id="fin-dia" placeholder="dd" min="1" max="31">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="fin-mes" placeholder="mm" min="1" max="12">
                            <span class="separador-fecha">/</span>
                            <input type="number" id="fin-anio" placeholder="aaaa" min="1000" max="9999">
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="caja-campo">
                        <label for="obs-menstruacion">Observaciones</label>
                        <textarea id="obs-menstruacion" maxlength="10" placeholder="Máximo 10 caracteres"></textarea>
                    </div>

                    <!-- Botón Guardar -->
                    <button type="button" id="guardar-menstruacion" class="btn-guardar-modal">
                        <svg width="32" height="32" viewBox="0 0 73 72" fill="none">
                            <path d="M17.8079 68.7743H54.6162C58.5211 68.7743 62.266 67.2363 65.0272 64.4987C67.7883 61.7611 69.3395 58.0481 69.3395 54.1765V19.1927C69.3393 18.2249 68.9341 17.2968 68.261 16.6125L55.6947 4.15328C55.0045 3.46882 54.0685 3.08419 53.0923 3.08398H17.8079C13.903 3.08398 10.1581 4.62197 7.3969 7.3596C4.63574 10.0972 3.08453 13.8102 3.08453 17.6818V54.1765C3.08453 58.0481 4.63574 61.7611 7.3969 64.4987C10.1581 67.2363 13.903 68.7743 17.8079 68.7743Z" stroke="black" stroke-width="6.16" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M54.616 68.7743V43.2281C54.616 42.2602 54.2282 41.3319 53.5379 40.6475C52.8476 39.9631 51.9114 39.5786 50.9352 39.5786H21.4885C20.5123 39.5786 19.5761 39.9631 18.8858 40.6475C18.1955 41.3319 17.8077 42.2602 17.8077 43.2281V68.7743" stroke="black" stroke-width="6.16"/>
                        </svg>
                        <span>Guardar registro</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- MODAL MEDICACIÓN -->
<div id="modal-medicacion" class="modal-overlay oculto">
    <div class="modal-tarjeta">
        <button type="button" class="btn-cerrar-modal" id="btn-cerrar-medicacion" aria-label="Cerrar">&times;</button>
       
        <div class="modal-encabezado">
            <h2 class="modal-titulo">medicación</h2>
            <svg width="45" height="45" viewBox="0 0 90 91" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60.8242 0.000152997C56.9864 -0.012317 53.1844 0.737601 49.6388 2.20638C46.0932 3.67516 42.8746 5.83354 40.1699 8.55625L8.52159 40.2046C-2.84053 51.5667 -2.84053 70.1049 8.52159 81.5131C14.0417 87.0331 21.3557 90.0692 29.1758 90.0692C36.9959 90.0692 44.31 87.0331 49.8301 81.5131L81.4784 49.8647C92.8405 38.5026 92.8405 19.9644 81.4784 8.55625C78.7737 5.83354 75.5551 3.67516 72.0096 2.20638C68.464 0.737601 64.6619 -0.012317 60.8242 0.000152997ZM74.9463 43.3326L62.3882 55.8908L34.0979 27.6005L46.656 15.0423C50.4281 11.2703 55.4421 9.20026 60.7782 9.20026C66.1142 9.20026 71.1283 11.2703 74.9003 15.0423C78.6347 18.8029 80.7305 23.8877 80.7305 29.1875C80.7305 34.4873 78.6347 39.572 74.9003 43.3326H74.9463Z" fill="black"/>
            </svg>
        </div>

        <form id="form-medicacion">
            <!-- Tipo de Medicación -->
            <div class="caja-campo">
                <label for="tipo-med-categoria">¿Qué tipo medicación tomaste?</label>
                <div class="input-desplegable-wrapper">
                    <select id="tipo-med-categoria" class="input-caja-select">
                        <option value="" disabled selected>selecciona</option>
                        <option value="Crónica">Crónica</option>
                        <option value="Rescate">Rescate</option>
                    </select>
                    <i class="fa-solid fa-chevron-down icono-flecha-select"></i>
                </div>
            </div>

            <!-- Medicación y Dosis en 2 columnas -->
            <div class="fila-dos-columnas">
                <div class="caja-campo">
                    <label for="nombre-med">medicación</label>
                    <div class="input-desplegable-wrapper">
                        <input type="text" id="nombre-med" list="lista-nombres-med" placeholder="selecciona" autocomplete="off">
                        <datalist id="lista-nombres-med"></datalist>
                        <i class="fa-solid fa-chevron-down icono-flecha-select"></i>
                    </div>
                </div>

                <div class="caja-campo">
                    <label for="dosis-med">dosis</label>
                    <div class="input-desplegable-wrapper">
                        <input type="text" id="dosis-med" list="lista-dosis-med" placeholder="selecciona" autocomplete="off">
                        <datalist id="lista-dosis-med"></datalist>
                        <i class="fa-solid fa-chevron-down icono-flecha-select"></i>
                    </div>
                </div>
            </div>

            <!-- Hora + Botones AM/PM -->
            <div class="caja-campo">
                <div class="label-con-icono">
                    <svg width="28" height="28" viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M27.5 52.5C41.3071 52.5 52.5 41.3071 52.5 27.5C52.5 13.6929 41.3071 2.5 27.5 2.5C13.6929 2.5 2.5 13.6929 2.5 27.5C2.5 41.3071 13.6929 52.5 27.5 52.5Z" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M35 37.5L28.965 31.465C28.0273 30.5275 27.5003 29.256 27.5 27.93V12.5" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <label for="hora-med">¿A qué hora la tomaste?</label>
                </div>
                <div class="campo-hora-caja">
                    <input type="time" id="hora-med">
                    <div class="opciones-periodo">
                        <button type="button" class="btn-periodo-med" data-periodo="AM">AM</button>
                        <button type="button" class="btn-periodo-med" data-periodo="PM">PM</button>
                    </div>
                </div>
            </div>

            <!-- Fecha -->
            <div class="caja-campo">
                <div class="label-con-icono">
                    <svg width="24" height="24" viewBox="0 0 58 52" fill="none">
