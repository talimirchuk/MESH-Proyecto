<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH-Inicio de sesión</title>
    <link class="css-path" rel="stylesheet" href="../css/iniciarsesion.css">
</head>
<body>
    <h1>Iniciar sesión</h1>
    <h2>¡Bienvenido de nuevo!</h2>
    <form>
        <label for="email">Email</label>
        <input type="email" class="formulario" id="email" placeholder="Introduci tu email">
    
        <label for="password">Contraseña</label>
        <input type="password" class="formulario" id="password" placeholder="Introduci tu contraseña">
        <p class="texto-ayuda">Listo, ya podés continuar</p>
        <button>Continuar</button>
    </form>

</body>
</html>
